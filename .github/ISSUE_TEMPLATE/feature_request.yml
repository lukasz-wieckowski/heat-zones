name: Feature request
description: Suggest an idea for Heat Zones.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What should Heat Zones do, and in what situation?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: textarea
    id: home
    attributes:
      label: Your setup
      description: Thermostats, sensors and integrations involved, if relevant.
